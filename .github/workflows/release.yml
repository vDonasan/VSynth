# Compila o Virtual Synth para Windows, Linux e macOS e publica os
# arquivos prontos para baixar na página de Releases do GitHub.
#
# - Ao publicar uma Release na página do GitHub (Releases > Draft a new
#   release > etiqueta v1.2.0 > Publish), ou ao enviar uma etiqueta
#   (git tag v1.2.0 && git push --tags): compila, testa e anexa os três
#   downloads à Release.
# - Em qualquer push na main: só compila e testa (os arquivos ficam como
#   "artifacts" da execução, sem Release).
name: Compilar e publicar

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # necessário para criar a Release

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux:
    timeout-minutes: 30
    runs-on: ubuntu-22.04 # glibc mais antiga: o binário roda em mais distribuições
    steps:
      - uses: actions/checkout@v5
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Compilar
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Testes
        run: ./build/test_dsp && ./build/test_midi_out && ./build/test_clap_host build/VirtualSynth.clap
      - name: Validador oficial do CLAP (free-audio/clap-validator)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p cv && cd cv
          gh release download -R free-audio/clap-validator --pattern '*inux*' --pattern '*buntu*' || exit 0
          ls -la
          for f in *; do
            case "$f" in
              *.tar.gz|*.tgz) tar xzf "$f" ;;
              *.zip) unzip -o -q "$f" ;;
            esac
          done
          for f in $(find . -type f -name '*.tar.gz' -newer . 2>/dev/null); do tar xzf "$f"; done
          find . -type f | head -20
          V=$(find . -type f -iname 'clap-validator*' ! -name '*.tar.gz' ! -name '*.zip' | head -1)
          chmod +x "$V"
          "$V" validate ../build/VirtualSynth.clap
      - name: Empacotar
        run: |
          mkdir -p VirtualSynth-Linux/Plugins
          cp build/synth VirtualSynth-Linux/VirtualSynth
          strip VirtualSynth-Linux/VirtualSynth
          cp build/VirtualSynth.clap VirtualSynth-Linux/Plugins/
          cp -r "$(find build -maxdepth 3 -type d -name VirtualSynth.vst3 | head -1)" VirtualSynth-Linux/Plugins/
          cp LICENSE VirtualSynth-Linux/
          cp packaging/LEIA-ME-Linux.txt VirtualSynth-Linux/LEIA-ME.txt
          tar czf VirtualSynth-Linux.tar.gz VirtualSynth-Linux
      - uses: actions/upload-artifact@v5
        with:
          name: VirtualSynth-Linux
          path: VirtualSynth-Linux.tar.gz

  windows:
    timeout-minutes: 30
    # Compilação cruzada com MinGW-w64 (o .exe sai sem DLLs extras), com ASIO
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev zip
      - name: Compilar
        run: |
          cmake -B build-win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-win -j
      - name: Conferir que não depende de DLLs fora do Windows
        run: |
          for f in build-win/synth.exe build-win/VirtualSynth.clap build-win/VirtualSynth.vst3; do
            x86_64-w64-mingw32-objdump -p "$f" | grep "DLL Name" | tee -a dlls.txt
          done
          ! grep -viE "kernel32|user32|gdi32|shell32|advapi32|ole32|oleaut32|winmm|msvcrt|ws2_32|opengl32|comdlg32|setupapi|uuid|imm32|version" dlls.txt
      - name: Empacotar
        run: |
          mkdir -p VirtualSynth-Windows/Plugins
          cp build-win/synth.exe VirtualSynth-Windows/VirtualSynth.exe
          x86_64-w64-mingw32-strip VirtualSynth-Windows/VirtualSynth.exe
          cp build-win/VirtualSynth.clap build-win/VirtualSynth.vst3 VirtualSynth-Windows/Plugins/
          x86_64-w64-mingw32-strip VirtualSynth-Windows/Plugins/*
          cp LICENSE VirtualSynth-Windows/LICENSE.txt
          cp packaging/LEIA-ME-Windows.txt VirtualSynth-Windows/LEIA-ME.txt
          zip -r VirtualSynth-Windows.zip VirtualSynth-Windows
      - uses: actions/upload-artifact@v5
        with:
          name: VirtualSynth-Windows
          path: VirtualSynth-Windows.zip

  windows-tests:
    timeout-minutes: 30
    # Os testes rodam num Windows de verdade
    needs: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake make git
      - name: Compilar e testar
        run: |
          cmake -B build -G "MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release -DSYNTH_VST3=OFF
          cmake --build build -j --target test_dsp test_midi_out test_clap_host
          ./build/test_dsp.exe && ./build/test_midi_out.exe && ./build/test_clap_host.exe build/VirtualSynth.clap

  macos:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compilar (Apple Silicon e Intel no mesmo app)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
                -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build -j
      - name: Testes
        run: ./build/test_dsp && ./build/test_midi_out && ./build/test_clap_host build/VirtualSynth.clap/Contents/MacOS/VirtualSynth
      - name: Montar o app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION=0.0.0;; esac
          APP="Virtual Synth.app"
          mkdir -p "$APP/Contents/MacOS"
          cp build/synth "$APP/Contents/MacOS/VirtualSynth"
          sed "s/@VERSION@/$VERSION/g" packaging/Info.plist > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP" # assinatura local: o macOS exige alguma no Apple Silicon
          mkdir -p VirtualSynth-macOS/Plugins
          mv "$APP" VirtualSynth-macOS/
          cp -R build/VirtualSynth.clap VirtualSynth-macOS/Plugins/
          cp -R "$(find build -maxdepth 3 -type d -name VirtualSynth.vst3 -prune | head -1)" VirtualSynth-macOS/Plugins/
          codesign --force --deep --sign - VirtualSynth-macOS/Plugins/VirtualSynth.clap VirtualSynth-macOS/Plugins/VirtualSynth.vst3
          cp LICENSE VirtualSynth-macOS/
          cp packaging/LEIA-ME-macOS.txt VirtualSynth-macOS/LEIA-ME.txt
          ditto -c -k --keepParent VirtualSynth-macOS VirtualSynth-macOS.zip
      - uses: actions/upload-artifact@v5
        with:
          name: VirtualSynth-macOS
          path: VirtualSynth-macOS.zip

  release:
    timeout-minutes: 30
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [linux, windows, windows-tests, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Publicar a Release
        uses: softprops/action-gh-release@v2
        with:
          name: Virtual Synth ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          append_body: ${{ github.event_name == 'release' }}
          body: |
            ## Baixar

            | Sistema | Arquivo |
            |---|---|
            | **Windows** 10/11 (64 bits) | `VirtualSynth-Windows.zip` |
            | **macOS** 11 ou mais novo (Apple Silicon e Intel) | `VirtualSynth-macOS.zip` |
            | **Linux** x86_64 | `VirtualSynth-Linux.tar.gz` |

            Descompacte e abra o programa; cada pacote tem um `LEIA-ME.txt`
            com os detalhes (avisos de segurança do Windows e do macOS na
            primeira vez, permissão de microfone etc.).

            Cada pacote também traz a pasta `Plugins` com o **VirtualSynth.clap**
            e o **VirtualSynth.vst3** para usar dentro do REAPER e de outras DAWs
            (veja o `LEIA-ME.txt`).
          files: |
            VirtualSynth-Windows.zip
            VirtualSynth-macOS.zip
            VirtualSynth-Linux.tar.gz
